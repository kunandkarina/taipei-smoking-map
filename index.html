<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>臺北市指定吸菸區地圖</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0e6b72" />

  <link rel="icon" type="image/png" sizes="32x32" href="public/icons/icon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="public/icons/icon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="public/icons/icon-180.png" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="吸菸區地圖" />

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
    integrity="sha256-YU3qCpj/P06tdPBJGPax0bm6Q1wltfwjsho5TR4+TYc="
    crossorigin=""
  />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
    integrity="sha256-YSWCMtmNZNwqex4CEw1nQhvFub2lmU7vcCKP+XVwwXA="
    crossorigin=""
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&display=swap"
  />
  <link rel="stylesheet" href="src/styles/main.css" />
</head>
<body>
  <div id="map"></div>

  <div id="top-stack" class="top-stack">
    <div id="location-banner" class="location-banner" hidden>
      <span id="location-banner-message"></span>
      <button id="location-banner-button" type="button">啟用定位</button>
    </div>

    <div id="filter-bar" class="filter-bar">
      <div class="filter-dropdown">
        <button
          id="district-toggle"
          class="filter-dropdown__button"
          type="button"
          aria-expanded="false"
          aria-haspopup="true"
        >
          <span>行政區</span>
          <span id="district-count" class="filter-dropdown__count" hidden></span>
          <svg class="filter-dropdown__chevron" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
            <path
              d="M6 9l6 6 6-6"
              stroke="currentColor"
              stroke-width="2"
              fill="none"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <div id="district-panel" class="filter-dropdown__panel" hidden>
          <div id="district-options" class="filter-dropdown__options"></div>
          <button id="district-clear" class="filter-dropdown__clear" type="button">清除選取</button>
        </div>
      </div>

      <div id="type-toggles" class="type-toggles"></div>
    </div>
  </div>

  <div id="detail-backdrop" class="detail-backdrop" hidden></div>

  <section
    id="detail-sheet"
    class="detail-sheet"
    hidden
    role="dialog"
    aria-modal="true"
    aria-labelledby="detail-name"
  >
    <div class="detail-sheet__handle" aria-hidden="true"></div>

    <header class="detail-sheet__header">
      <div class="detail-sheet__heading">
        <h2 id="detail-name" class="detail-sheet__name"></h2>
        <div class="detail-sheet__meta">
          <span id="detail-district" class="detail-sheet__district"></span>
          <span id="detail-type-badge" class="type-badge"></span>
        </div>
      </div>
      <button id="detail-close" class="detail-sheet__close" type="button" aria-label="關閉">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path
            d="M6 6L18 18M18 6L6 18"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </button>
    </header>

    <div class="detail-sheet__body">
      <section class="detail-field">
        <p class="detail-field__eyebrow">ADDRESS <span>地址</span></p>
        <p id="detail-address" class="detail-field__value"></p>
      </section>

      <section class="detail-field">
        <p class="detail-field__eyebrow">NEARBY <span>相對位置</span></p>
        <p id="detail-relative-position" class="detail-field__value"></p>
      </section>

      <section class="detail-field">
        <p class="detail-field__eyebrow">HOURS <span>開放時間</span></p>
        <p id="detail-hours" class="detail-field__value"></p>
      </section>

      <section class="detail-field">
        <p class="detail-field__eyebrow">TYPE <span>樣態</span></p>
        <p id="detail-type" class="detail-field__value"></p>
      </section>

      <section class="detail-field">
        <p class="detail-field__eyebrow">MANAGED BY <span>管理單位</span></p>
        <p id="detail-managed-by" class="detail-field__value"></p>
      </section>

      <section class="detail-field">
        <p class="detail-field__eyebrow">PHONE <span>電話</span></p>
        <p id="detail-phone" class="detail-field__value"></p>
      </section>

      <section class="detail-field">
        <p class="detail-field__eyebrow">PHOTO <span>照片</span></p>
        <div id="detail-photo" class="detail-photo"></div>
      </section>

      <section id="detail-note" class="detail-note"></section>
    </div>

    <footer class="detail-sheet__footer">
      <button id="detail-navigate" class="detail-navigate" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path
            d="M12 2L4.5 20l7.5-4 7.5 4L12 2z"
            fill="currentColor"
          />
        </svg>
        <span>前往導航 <span class="detail-navigate__en">NAVIGATE</span></span>
      </button>
    </footer>
  </section>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script
    src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"
    integrity="sha256-Hk4dIpcqOSb0hZjgyvFOP+cEmDXUKKNE/tT542ZbNQg="
    crossorigin=""
  ></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
